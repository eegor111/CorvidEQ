name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and create GitHub release
        id: tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: CorvidEQ v__VERSION__
          releaseBody: See the installer and SHA-256 checksum below.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Generate and upload SHA256SUMS.txt
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri-action.outputs.artifactPaths }}
          UPLOAD_URL: ${{ steps.tauri-action.outputs.releaseUploadUrl }}
        run: |
          $paths = $env:ARTIFACT_PATHS | ConvertFrom-Json
          $lines = foreach ($path in $paths) {
            if ((Test-Path $path) -and ($path -like '*.exe') -and ($path -notlike '*.sig')) {
              $hash = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
              $name = Split-Path -Path $path -Leaf
              "$hash  $name"
            }
          }
          if (-not $lines) {
            throw "No .exe installer artifact found to checksum."
          }
          $sumFile = "SHA256SUMS.txt"
          Set-Content -Path $sumFile -Value $lines -Encoding utf8NoBOM

          $baseUpload = ($env:UPLOAD_URL -replace '\{\?.*\}$', '')
          $targetUrl = "${baseUpload}?name=$sumFile"
          Invoke-RestMethod -Method Post -Uri $targetUrl -InFile $sumFile -ContentType "text/plain; charset=utf-8" -Headers @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          } | Out-Null
